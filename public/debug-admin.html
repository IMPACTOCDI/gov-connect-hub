<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Admin - Gov Connect Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }
        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .info-box {
            background: #f0f9ff;
            border-left: 4px solid #1e3a8a;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .info-box h3 {
            color: #1e3a8a;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .info-box p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }
        .code {
            background: #1e293b;
            color: #22c55e;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            display: inline-block;
            margin: 5px 0;
        }
        .button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .button:hover {
            background: #1e40af;
        }
        .button.success {
            background: #16a34a;
        }
        .button.success:hover {
            background: #15803d;
        }
        .button.danger {
            background: #dc2626;
        }
        .button.danger:hover {
            background: #b91c1c;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
        }
        .status.success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .status.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #bfdbfe;
        }
        .email-list {
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .email-item {
            padding: 8px;
            background: white;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            font-family: monospace;
            font-size: 13px;
        }
        .divider {
            height: 1px;
            background: #e2e8f0;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Debug Administrador</h1>
        <p class="subtitle">Ferramenta de diagnóstico e configuração do sistema</p>

        <div class="info-box">
            <h3>📧 Credenciais de Acesso</h3>
            <p>
                <strong>Email:</strong> <span class="code">admin@impactocdi.com.br</span><br>
                <strong>Senha:</strong> <span class="code">admin123</span><br>
                <strong>Tipo:</strong> Gestão da plataforma
            </p>
        </div>

        <button class="button" onclick="verificarAdmins()">🔍 Verificar Emails Admin</button>
        
        <div id="status"></div>
        
        <div class="divider"></div>

        <div class="info-box">
            <h3>🛠️ Ferramentas de Correção</h3>
            <p>Se você ainda recebe "Acesso restrito", use as opções abaixo:</p>
        </div>

        <button class="button success" onclick="adicionarAdminInicial()">➕ Adicionar Email Admin Inicial</button>
        <button class="button danger" onclick="limparTudo()">🗑️ Limpar Todo LocalStorage</button>
        <button class="button" onclick="window.location.href='/login'">🚀 Ir para Login</button>
    </div>

    <script>
        const ADMIN_EMAIL_INICIAL = 'admin@impactocdi.com.br';
        const STORAGE_KEY = 'govconnect_admin_emails';

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
        }

        function verificarAdmins() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                let emails = [];
                
                if (stored) {
                    emails = JSON.parse(stored);
                }

                let html = '<h3>📋 Status Atual:</h3>';
                
                if (emails.length === 0) {
                    html += '<p style="color: #dc2626; font-weight: bold;">❌ Nenhum email admin cadastrado!</p>';
                    html += '<p>Clique em "Adicionar Email Admin Inicial" abaixo.</p>';
                } else {
                    html += `<p style="color: #16a34a; font-weight: bold;">✅ ${emails.length} email(s) cadastrado(s):</p>`;
                    html += '<div class="email-list">';
                    emails.forEach(email => {
                        const isInicial = email.toLowerCase() === ADMIN_EMAIL_INICIAL.toLowerCase();
                        html += `<div class="email-item">${isInicial ? '⭐ ' : ''}${email}</div>`;
                    });
                    html += '</div>';
                    
                    const hasInicial = emails.some(e => e.toLowerCase() === ADMIN_EMAIL_INICIAL.toLowerCase());
                    if (!hasInicial) {
                        html += '<p style="color: #dc2626; margin-top: 10px;">⚠️ O email inicial não está na lista!</p>';
                    }
                }

                showStatus(html, emails.length > 0 ? 'success' : 'error');
            } catch (error) {
                showStatus(`❌ Erro ao verificar: ${error.message}`, 'error');
            }
        }

        function adicionarAdminInicial() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                let emails = stored ? JSON.parse(stored) : [];
                
                const adminInicialLower = ADMIN_EMAIL_INICIAL.toLowerCase();
                const hasAdminInicial = emails.some(e => e.toLowerCase() === adminInicialLower);
                
                if (!hasAdminInicial) {
                    emails.unshift(ADMIN_EMAIL_INICIAL);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(emails));
                    showStatus(`✅ Email admin adicionado com sucesso!<br><br>📧 <strong>${ADMIN_EMAIL_INICIAL}</strong><br><br>Agora você pode fazer login!`, 'success');
                    
                    setTimeout(() => {
                        if (confirm('Email adicionado! Deseja ir para a página de login agora?')) {
                            window.location.href = '/login';
                        }
                    }, 2000);
                } else {
                    showStatus(`ℹ️ O email <strong>${ADMIN_EMAIL_INICIAL}</strong> já está cadastrado!<br><br>Você pode tentar fazer login agora.`, 'info');
                }
            } catch (error) {
                showStatus(`❌ Erro ao adicionar email: ${error.message}`, 'error');
            }
        }

        function limparTudo() {
            if (!confirm('⚠️ ATENÇÃO!\n\nIsso vai limpar TODOS os dados do localStorage:\n- Emails admin\n- Empresas cadastradas\n- Compradores\n- Demandas\n- Todos os dados\n\nTem certeza?')) {
                return;
            }

            try {
                const keys = Object.keys(localStorage).filter(k => k.startsWith('govconnect_'));
                keys.forEach(key => localStorage.removeItem(key));
                
                showStatus(`✅ LocalStorage limpo com sucesso!<br><br>${keys.length} chave(s) removida(s).<br><br>Recarregando a página...`, 'success');
                
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
            } catch (error) {
                showStatus(`❌ Erro ao limpar: ${error.message}`, 'error');
            }
        }

        // Verificar automaticamente ao carregar
        window.onload = verificarAdmins;
    </script>
</body>
</html>
